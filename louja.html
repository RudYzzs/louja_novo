<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeekZone - Cthulhu Store</title>
  
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <h1>GeekZone 🐙</h1>
    </div>
    
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Procurar artefatos...">
    </div>

    <div class="actions">
      <button id="theme-toggle" class="btn-secondary" title="Alternar Tema">
        <i class="fa-solid fa-moon"></i>
      </button>
      <button id="add-product-btn" class="btn-primary">
        <i class="fa-solid fa-plus"></i> Novo Item
      </button>
      <button id="cart-btn" class="btn-cart">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count">0</span>
      </button>
    </div>
  </header>

  <!-- Filtros -->
  <nav class="categories">
    <button class="filter-btn active" data-category="all">Todos</button>
    <button class="filter-btn" data-category="eletronicos">Eletrônicos</button>
    <button class="filter-btn" data-category="colecionaveis">Colecionáveis</button>
  </nav>

  <!-- Grid de Produtos -->
  <main class="container">
    <div id="product-grid" class="product-grid"></div>
  </main>

  <!-- Modal do Carrinho -->
  <div id="cart-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Seu Carrinho Cósmico</h2>
        <button id="close-cart" class="close-btn">&times;</button>
      </div>
      
      <div id="cart-items" class="cart-items"></div>

      <div class="shipping-section" style="margin-top:1.5rem;">
        <input type="text" id="shipping-address" placeholder="Endereço de entrega" style="width:100%; margin-bottom:8px; padding:8px; border-radius:4px; border:var(--border-cthulhu); background:var(--bg-primary); color:var(--text-primary);">
        <input type="number" id="shipping-distance" placeholder="Distância em km" style="width:100%; margin-bottom:8px; padding:8px; border-radius:4px; border:var(--border-cthulhu); background:var(--bg-primary); color:var(--text-primary);">
        <button id="btn-calc-shipping" class="btn-secondary" style="width:100%;">Calcular Frete</button>
        <p id="shipping-alert" class="alert-error" style="display: none;"></p>
      </div>

      <div class="cart-summary" style="margin-top:1.5rem; border-top:var(--border-cthulhu); padding-top:1rem;">
        <p style="display:flex; justify-content:space-between;">Subtotal: <span id="cart-subtotal">R$ 0,00</span></p>
        <p id="discount-row" style="display: none; justify-content:space-between; color: var(--accent-color);">
          Desconto Cthulhu: <span id="cart-discount">-R$ 0,00</span>
        </p>
        <p style="display:flex; justify-content:space-between;">Frete: <span id="cart-shipping-cost">R$ 0,00</span></p>
        <h3 style="display:flex; justify-content:space-between; margin-top:0.5rem; color:var(--accent-color);">Total: <span id="cart-total">R$ 0,00</span></h3>
      </div>

      <button id="checkout-btn" class="btn-primary" style="width:100%; margin-top:1rem;" disabled>Finalizar Oferenda</button>
    </div>
  </div>

  <!-- Modal Cadastrar Produto -->
  <div id="product-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Cadastrar Artefato</h2>
        <button id="close-product-modal" class="close-btn">&times;</button>
      </div>
      <form id="product-form" style="display:flex; flex-direction:column; gap:12px;">
        <input type="text" id="prod-name" placeholder="Nome do Produto" required style="padding:10px; background:var(--bg-primary); border:var(--border-cthulhu); color:var(--text-primary); border-radius:4px;">
        <input type="number" id="prod-price" step="0.01" placeholder="Preço (R$)" required style="padding:10px; background:var(--bg-primary); border:var(--border-cthulhu); color:var(--text-primary); border-radius:4px;">
        <select id="prod-category" required style="padding:10px; background:var(--bg-primary); border:var(--border-cthulhu); color:var(--text-primary); border-radius:4px;">
          <option value="eletronicos">Eletrônicos</option>
          <option value="colecionaveis">Colecionáveis</option>
        </select>
        <input type="url" id="prod-image" placeholder="URL da Imagem" style="padding:10px; background:var(--bg-primary); border:var(--border-cthulhu); color:var(--text-primary); border-radius:4px;">
        <button type="submit" class="btn-primary" style="padding:10px;">Salvar Item</button>
      </form>
    </div>
  </div>

  <!-- Widget Cthulhu Bot -->
  <div id="cthulhuBot" class="chat-widget">
    <button id="chat-toggle-btn" class="chat-toggle-btn" title="Invocar Cthulhu">
      <i class="fa-solid fa-spaghetti-monster-flying"></i>
    </button>
    
    <div id="chat-window" class="chat-window">
      <div class="chat-header">
        <div class="chat-title">
          <i class="fa-solid fa-eye"></i> Oracle Cthulhu
        </div>
        <button id="close-chat" class="close-btn">&times;</button>
      </div>

      <div id="chat-messages" class="chat-messages"></div>
      
      <div id="mic-status" class="mic-status">Escutando voz...</div>

      <div class="chat-input-area">
        <button id="mic-btn" class="mic-btn" title="Invocar por voz">
          <i class="fa-solid fa-microphone"></i>
        </button>
        <input type="text" id="user-input" placeholder="Digite uma palavra mística...">
        <button id="chat-send-btn" class="chat-send-btn">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/cthulhu-bot.js"></script>
  <script src="js/chat-ui.js"></script>
  <script src="js/louja.js"></script>
  <script src="js/R.E_easteregg.js"></script>
</body>
</html>
