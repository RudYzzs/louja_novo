<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeekZone - Eletrônicos e Colecionáveis</title>
    <!-- CSS da Loja e CSS do Chat Bot -->
    <link rel="stylesheet" href="css/louja.css">
    <link rel="stylesheet" href="css/chat.css">
</head>
<body class="theme-dark">

    <!-- CABEÇALHO DA LOJA -->
    <header class="header">
        <div class="header-container">
            <h1>GeekZone 🐙</h1>
            <p>Sua loja de eletrônicos e colecionáveis das profundezas</p>
            <button id="themeToggleBtn" class="theme-btn">Modo Claro / Escuro</button>
        </div>
    </header>

    <div class="main-container">
        <!-- FORMULÁRIO DE CADASTRO DE PRODUTOS -->
        <section class="section-box">
            <h2>Cadastrar Novo Produto</h2>
            <form id="productForm">
                <div class="form-group">
                    <label for="prodName">Nome do Produto:</label>
                    <input type="text" id="prodName" placeholder="Ex: Action Figure Cthulhu" required>
                </div>
                <div class="form-group">
                    <label for="prodPrice">Preço (R$):</label>
                    <input type="number" id="prodPrice" step="0.01" min="0" placeholder="Ex: 150.00" required>
                </div>
                <button type="submit" class="primary-btn">Adicionar Produto</button>
            </form>
        </section>

        <!-- VITRINE DE PRODUTOS -->
        <section class="section-box">
            <h2>Vitrine de Produtos</h2>
            <div id="productList" class="product-grid">
                <!-- Produtos serão inseridos via JavaScript -->
            </div>
        </section>

        <!-- CARRINHO DE COMPRAS DINÂMICO -->
        <section class="section-box cart-section">
            <h2>Carrinho de Compras</h2>
            <ul id="cartList" class="cart-list">
                <!-- Itens adicionados aparecem aqui -->
            </ul>
            <div class="cart-total">
                <span>Total: R$ <span id="cartTotalValue">0.00</span></span>
                <button id="clearCartBtn" class="clear-btn">Esvaziar Carrinho</button>
            </div>
        </section>
    </div>

    <!-- SCRIPTS DA LOJA E DO CHAT -->
    <script src="js/louja.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
